[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-args=-ObjC"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-args=-ObjC"]

[target.aarch64-apple-ios]
rustflags = ["-C", "link-args=-ObjC"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-args=-ObjC"]

# Build against the vendored GStreamer (scripts/gstreamer/fetch-macos.sh).
# pkgconfig-cargo holds only the GStreamer/GLib .pc files, so other -sys crates
# (bzip2-sys, openssl-sys, ...) don't link the framework's copies of their libs.
# If third_party/gstreamer/sdk is missing, pkg-config falls back to the system
# GStreamer. A PKG_CONFIG_PATH already set in the shell takes precedence.
[env]
PKG_CONFIG_PATH = { value = "third_party/gstreamer/sdk/lib/pkgconfig-cargo", relative = true }
